syntax = "proto3";

package envoy.extensions.private_key_providers.qat.v3alpha;

import "envoy/config/core/v3/base.proto";

import "google/protobuf/duration.proto";
import "google/protobuf/wrappers.proto";

import "udpa/annotations/sensitive.proto";
import "udpa/annotations/status.proto";
import "validate/validate.proto";

option java_package = "io.envoyproxy.envoy.extensions.private_key_providers.qat.v3alpha";
option java_outer_classname = "QatProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/contrib/envoy/extensions/private_key_providers/qat/v3alpha";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

// [#protodoc-title: `QAT` private key provider]
// [#extension: envoy.tls.key_providers.qat]

// This message specifies how the private key provider is configured.
// The private key provider provides RSA sign and decrypt operation
// hardware acceleration.

// [#next-free-field: 4]
message QatPrivateKeyMethodConfig {
  message CryptoMbFallback {
    // Number of times to retry submitting an operation after QAT reports CPA_STATUS_RETRY.
    // After these retries are exhausted, the operation is submitted to CryptoMB.
    // Note: CPA_STATUS_RETRY does not mean "QAT is busy".
    // It is caused when the queue is full or maybe when an error or something happened.
    //
    // Defaults to ``3``. Probably do not change this.
    google.protobuf.UInt32Value max_retry_count = 1
        [(validate.rules).uint32 = {lte: 1000}];

    // How long to wait until the CryptoMB per-thread processing queue should be processed.
    // The duration needs to be set to a value greater than or equal to 1 millisecond.
    google.protobuf.Duration poll_delay = 2 [(validate.rules).duration = {
      required: true
      gte {nanos: 1000000}
    }];

    // QAT operation latency that marks the selected QAT instance as busy. New private key
    // operations assigned to that instance use CryptoMB for the configured cooldown after this
    // threshold is reached. 
    // Latency is measured from the initial QAT submission attempt until the
    // completion callback is observed. Because completions are discovered by
    // polling, the measurement includes time waiting for a polling cycle.
    //
    // Defaults to 5 milliseconds.
    google.protobuf.Duration latency_threshold = 3
        [(validate.rules).duration = {gte {nanos: 1000000}}];

    // How long new private key operations use CryptoMB after a slow QAT operation.
    //
    // Defaults to 1 second.
    google.protobuf.Duration cooldown = 4
        [(validate.rules).duration = {gte {nanos: 1000000}}];
  }

  // Private key to use in the private key provider. If set to inline_bytes or
  // inline_string, the value needs to be the private key in PEM format.
  config.core.v3.DataSource private_key = 1 [(udpa.annotations.sensitive) = true];

  // How long to wait before polling the hardware accelerator after a
  // request has been submitted there. Having a small value leads to
  // quicker answers from the hardware but causes more polling loop
  // spins, leading to potentially larger CPU usage. The duration needs
  // to be set to a value greater than or equal to 1 millisecond.
  google.protobuf.Duration poll_delay = 2 [(validate.rules).duration = {
    required: true
    gte {nanos: 1000000}
  }];

  // If configured, operations that cannot be submitted to QAT after the configured number of
  // retries, or are assigned to a QAT instance in latency cooldown, are submitted to CryptoMB
  // instead. The same private key is used by both providers.
  CryptoMbFallback cryptomb_fallback = 3;
}
