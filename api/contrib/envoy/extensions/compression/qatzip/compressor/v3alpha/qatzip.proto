syntax = "proto3";

package envoy.extensions.compression.qatzip.compressor.v3alpha;

import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/wrappers.proto";

import "udpa/annotations/status.proto";
import "validate/validate.proto";

option java_package = "io.envoyproxy.envoy.extensions.compression.qatzip.compressor.v3alpha";
option java_outer_classname = "QatzipProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/contrib/envoy/extensions/compression/qatzip/compressor/v3alpha";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

// [#protodoc-title: Qatzip Compressor]
// Qatzip :ref:`configuration overview <config_qatzip>`.
// [#extension: envoy.compression.qatzip.compressor]

// [#next-free-field: 7]
message Qatzip {
  message GzipFallback {
    message Canary {
      // Canaries use the enclosing QATzip compression level, hardware buffer size, stream buffer
      // size, and input-size threshold.

      // Number of fixed compression operations used to establish the startup latency baseline.
      // Defaults to ``30``.
      google.protobuf.UInt32Value startup_samples = 1
          [(validate.rules).uint32 = {lte: 1000 gte: 2}];

      // Delay between startup samples. Defaults to ``0.01s``.
      google.protobuf.Duration startup_sample_interval = 2 [(validate.rules).duration = {
        lt {seconds: 60}
        gte {nanos: 1000000}
      }];

      // Interval between runtime canaries. Defaults to ``1s``.
      google.protobuf.Duration poll_interval = 3 [(validate.rules).duration = {
        lt {seconds: 60}
        gte {nanos: 1000000}
      }];

      // Amount subtracted from the QAT routing probability after a busy canary.
      // Defaults to ``0.1``.
      google.protobuf.DoubleValue probability_decrease = 4
          [(validate.rules).double = {lte: 1.0 gt: 0.0}];

      // Amount added to the QAT routing probability after a healthy canary.
      // Defaults to ``0.1``.
      google.protobuf.DoubleValue probability_increase = 5
          [(validate.rules).double = {lte: 1.0 gt: 0.0}];

      // Size of the fixed deterministic canary input. The default is the larger of 64 KiB and the
      // configured QATzip input-size threshold.
      google.protobuf.UInt32Value input_size = 6
          [(validate.rules).uint32 = {lte: 2097152 gte: 128}];

      // Minimum latency threshold used to classify QAT as busy. This prevents normal sub-
      // millisecond variation between QAT instances from triggering fallback. Defaults to
      // ``0.001s``. Set to ``0s`` to disable the minimum.
      google.protobuf.Duration min_critical_value = 7 [(validate.rules).duration = {
        lt {seconds: 60}
        gte {}
      }];
    }

    // Enables fixed-work compression latency canaries and deterministic routing between QATzip and
    // gzip.
    Canary canary = 1;

    // Gzip compressor configuration used by the fallback. The typed configuration must
    // contain an ``envoy.extensions.compression.gzip.compressor.v3.Gzip`` message. If unset, the
    // fallback uses the QATzip compression level and chunk size with the gzip defaults for all
    // other options.
    google.protobuf.Any gzip = 2;
  }

  enum HardwareBufferSize {
    DEFAULT = 0;
    SZ_4K = 1;
    SZ_8K = 2;
    SZ_32K = 3;
    SZ_64K = 4;
    SZ_128K = 5;
    SZ_512K = 6;
  }

  // Value from 1 to 9 that controls the main compression speed-density lever.
  // The higher quality, the slower compression. The default value is 1.
  google.protobuf.UInt32Value compression_level = 1 [(validate.rules).uint32 = {lte: 9 gte: 1}];

  // A size of qat hardware buffer. This field will be set to "DEFAULT" if not specified.
  HardwareBufferSize hardware_buffer_size = 2 [(validate.rules).enum = {defined_only: true}];

  // Threshold of compression service’s input size for software failover.
  // If the size of input request less than the threshold, qatzip will route the request to software
  // compressor. The default value is 1024. The maximum value is 512*1024.
  google.protobuf.UInt32Value input_size_threshold = 3
      [(validate.rules).uint32 = {lte: 524288 gte: 128}];

  // A size of stream buffer. The default value is 128 * 1024. The maximum value is 2*1024*1024 -
  // 5*1024
  google.protobuf.UInt32Value stream_buffer_size = 4
      [(validate.rules).uint32 = {lte: 2092032 gte: 1024}];

  // Value for compressor's next output buffer. If not set, defaults to 4096.
  google.protobuf.UInt32Value chunk_size = 5 [(validate.rules).uint32 = {lte: 65536 gte: 4096}];

  // Configures Envoy's gzip fallback, which is backed by zlib-ng in standard Envoy builds. When
  // canaries are enabled, streams rejected by deterministic admission use gzip. Once a stream has
  // emitted output, it continues using its selected compressor for the remainder of the stream.
  GzipFallback gzip_fallback = 6;
}
